<!doctype html>
<html lang="en">
  <head>
    <link rel="shortcut icon" href="./assets/imgs/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <form>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <title>search</title>
        <path
          d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"
        />
      </svg>
      <input
        type="text"
        id="search-input"
        placeholder="Search for location"
        required
      />
      <button id="search-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <title>search</title>
          <path
            d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z"
          />
        </svg>
      </button>
    </form>

    <div id="error-container" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <title>alert-circle-outline</title>
        <path
          d="M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z"
        />
      </svg>
      <p id="error-text"></p>
    </div>

    <div class="display">
      <h1 id="location"></h1>
      <p class="subheading">
        <span id="condition"></span> • <span id="date"></span>
      </p>
      <img id="icon" src="#" width="200" height="200" />
      <div class="temp-container">
        <p id="temperature"></p>
        <label id="temp-unit-toggle-container" for="temp-unit-toggle">
          <input type="checkbox" id="temp-unit-toggle" checked />
          <p id="fahrenheit-label">ºF</p>
          <p id="celsius-label">ºC</p>
        </label>
      </div>
    </div>
  </body>
</html>
