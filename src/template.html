<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <form>
      <input
        type="text"
        id="search-input"
        placeholder="Search for location"
        required
      />
      <button id="search-btn">Search</button>
    </form>

    <div class="display">
      <h1 id="location"></h1>
      <p><span id="condition"></span> • <span id="date"></span></p>
      <img src="#" id="icon" width="200" height="200" />
      <p id="temperature"></p>
    </div>
  </body>
</html>
